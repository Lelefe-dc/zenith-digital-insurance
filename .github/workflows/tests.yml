name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Validate Docker Compose
        run: docker compose config > /tmp/zenith-compose.yml
      - name: Build application image
        run: docker build -t zenith-digital-insurance:test .
