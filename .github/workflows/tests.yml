name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Validate management JavaScript
        run: |
          node --check app/static/admin.js
          node --check app/static/admin-extra.js
      - name: Run tests
        run: pytest -q
      - name: Import application
        env:
          DATABASE_URL: sqlite:////tmp/zenith-ci.db
          MANAGEMENT_ADMIN_EMAIL: admin@zenith.local
          MANAGEMENT_ADMIN_PASSWORD: change-me-now
        run: python -c "from app.main import app; assert app.version == '2.0.0'; print(app.title)"
      - name: Validate Docker Compose
        run: docker compose config > /tmp/zenith-compose.yml
      - name: Build backend image
        run: docker compose build app
      - name: Build frontend image
        run: docker compose build frontend
