name: zenith-digital-insurance

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenith_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-zenith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zenith_dev_password}
    volumes:
      - zenith_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenith} -d ${POSTGRES_DB:-zenith_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - zenith

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zenith-digital-insurance-backend:local
    restart: unless-stopped
    init: true
    ports:
      - "${BACKEND_PORT:-8201}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zenith}:${POSTGRES_PASSWORD:-zenith_dev_password}@db:5432/${POSTGRES_DB:-zenith_assistant}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      UPLOAD_DIR: /app/data/uploads
      MANAGEMENT_ADMIN_EMAIL: ${MANAGEMENT_ADMIN_EMAIL:-admin@zenith.local}
      MANAGEMENT_ADMIN_PASSWORD: ${MANAGEMENT_ADMIN_PASSWORD:-change-me-now}
      MANAGEMENT_SESSION_HOURS: ${MANAGEMENT_SESSION_HOURS:-12}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-replace-with-random-verify-token}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      REQUIRE_POLICY_OTP: ${REQUIRE_POLICY_OTP:-false}
    volumes:
      - zenith_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - zenith

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: zenith-digital-insurance-frontend:local
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-3201}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zenith

volumes:
  zenith_db:
  zenith_uploads:

networks:
  zenith:
    driver: bridge
