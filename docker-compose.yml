services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenith_assistant
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: zenith_dev_password
    volumes:
      - zenith_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith -d zenith_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://zenith:zenith_dev_password@db:5432/zenith_assistant
      ADMIN_TOKEN: change-me
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - zenith_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  zenith_db:
  zenith_uploads:
